# Renvani — Render Blueprint DRAFT (FS-93)
#
# STATUS: NOT APPLIED — reference only. Do not connect a Blueprint or provision resources
# without founder authorization. Web stays on **Vercel** (no Render web service).
#
# Folded from useful `deploy/render` @ 80c2cd07 (branch left untouched; not merged).
# Health: FS-79 (#71) — use `/health` (liveness) and `/health/ready` (readiness); no duplicate routes.
# Listen: Render injects `PORT`; apps use `PORT ?? API_PORT` / `PORT ?? WEBHOOK_PORT` (@fsm/config).
#
# CORS: API allows browser origin = `APP_URL` (set to production Vercel URL, sync: false).
#
# PostgreSQL: **Neon** (STACK-12) — same region as the Render API web service. Set `DATABASE_URL`
# manually from Neon (pooler URL recommended); not provisioned by this Blueprint.
#
# Note: `@fsm/config` still validates the shared env schema at process start on all services.
# Least-privilege blocks below are the secrets each service *should* receive in Render;
# ops may need to add other required keys from docs/security/FS-76-secrets-env-inventory.md until
# per-service env schemas land.

services:
  - type: keyvalue
    name: renvani-bullmq-kv
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: renvani-api
    runtime: node
    plan: starter
    buildCommand: corepack enable && corepack pnpm install --frozen-lockfile && corepack pnpm build
    preDeployCommand: corepack pnpm --filter @fsm/db db:migrate
    startCommand: corepack pnpm --filter @fsm/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: renvani-bullmq-kv
          property: connectionString
      - key: APP_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: BOOKING_HOLD_TOKEN_SECRET
        sync: false
      - key: ACCESS_TOKEN_TTL_SECONDS
        sync: false
      - key: REFRESH_TOKEN_TTL_SECONDS
        sync: false
      - key: RESET_TOKEN_TTL_SECONDS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CONNECT_CLIENT_ID
        sync: false
      - key: STRIPE_PLATFORM_FEE_PERCENT
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false

  - type: worker
    name: renvani-worker
    runtime: node
    plan: starter
    buildCommand: corepack enable && corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: corepack pnpm --filter @fsm/worker start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: renvani-bullmq-kv
          property: connectionString
      - key: APP_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PLATFORM_FEE_PERCENT
        sync: false

  - type: web
    name: renvani-webhook
    runtime: node
    plan: starter
    buildCommand: corepack enable && corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: corepack pnpm --filter @fsm/webhook start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: renvani-bullmq-kv
          property: connectionString
      - key: APP_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
