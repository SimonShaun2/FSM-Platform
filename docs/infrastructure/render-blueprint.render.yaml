# Renvani — Render Blueprint DRAFT (FS-93)
#
# STATUS: NOT APPLIED — reference only under docs/infrastructure/
# Do not create Blueprint instances from this file without founder authorization.
# Founder decision 2026-10-22: Vercel (web) + Render (API, worker, webhook, Postgres, Key Value) + R2 + in-repo JWT.
#
# When promoting to production/staging:
#   - Move or copy to repository root as render.yaml in a reviewed platform PR.
#   - Set region consistently across services.
#   - Fill sync: false secrets in Render Dashboard.
#
# BullMQ: Key Value MUST use maxmemoryPolicy: noeviction (see docs/platform/FS-93-render-runbook.md).

services:
  - type: keyvalue
    name: renvani-bullmq-kv
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: [] # internal-only; API/worker/webhook use private connectionString

  - type: web
    name: renvani-api
    runtime: node
    plan: starter
    buildCommand: corepack enable && corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: corepack pnpm --filter @fsm/api start
    # healthCheckPath: /health  # enable when API exposes health route (FS-75 matrix)
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: renvani-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: renvani-bullmq-kv
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false

  - type: worker
    name: renvani-worker
    runtime: node
    plan: starter
    buildCommand: corepack enable && corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: corepack pnpm --filter @fsm/worker start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: renvani-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: renvani-bullmq-kv
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false

  - type: web
    name: renvani-webhook
    runtime: node
    plan: starter
    buildCommand: corepack enable && corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: corepack pnpm --filter @fsm/webhook start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: renvani-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: renvani-bullmq-kv
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false

databases:
  - name: renvani-postgres
    plan: starter
    databaseName: renvani
    user: renvani
