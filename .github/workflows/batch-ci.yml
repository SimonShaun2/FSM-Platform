# BATCH-FS1-GOV-001 — approved batch only (label-gated). No per-PR CI.
name: Batch CI (approved)

on:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: batch-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  batch:
    if: contains(github.event.pull_request.labels.*.name, 'batch-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
